<!doctype html><html><head><meta charset="utf-8"><style>
@font-face{font-family:NR;src:url(newsreader-latin-500-normal.woff2);font-weight:500}
@font-face{font-family:IN;src:url(inter-latin-wght-normal.woff2);font-weight:100 900}
*{margin:0;padding:0;box-sizing:border-box}
body{width:3000px;height:2250px;position:relative;overflow:hidden;background:url(plate.png);font-family:IN}
/* soft light wash behind the headline so type stays crisp; subtle edge vignette for depth */
.wash{position:absolute;left:0;right:0;top:0;height:760px;background:linear-gradient(180deg,rgba(246,241,252,.82) 0%,rgba(246,241,252,.55) 70%,rgba(246,241,252,0) 100%)}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse 70% 72% at 50% 58%,rgba(0,0,0,0) 58%,rgba(40,20,70,.20) 100%)}
.top{position:absolute;left:0;right:0;top:70px;text-align:center;color:#160F2E}
.kick{font-weight:700;font-size:44px;letter-spacing:.2em;color:#4A2F98}
h1{font-family:NR;font-weight:500;font-size:178px;line-height:.95;margin-top:26px;letter-spacing:-.015em}
h1 em{display:block;font-style:italic;color:#5332B4}
.sub{margin-top:30px;font-weight:600;font-size:56px;color:#22193F;letter-spacing:-.005em}
.sub b{color:#9C8AD8;font-weight:500;margin:0 16px}
.chips{position:absolute;left:0;right:0;top:2002px;display:flex;justify-content:center;gap:24px}
.chip{background:#1F1442;color:#fff;font-weight:650;font-size:46px;padding:26px 40px;border-radius:999px;box-shadow:0 18px 40px rgba(30,15,60,.30);white-space:nowrap}
.chip i{font-style:normal;color:#C9B8FF;margin-right:16px}
</style></head><body>
<div class="wash"></div><div class="vig"></div>
<div class="top">
 <div class="kick">FOR FREELANCE SOCIAL MEDIA MANAGERS</div>
 <h1>Social Media Manager<em>Planner App</em></h1>
 <div class="sub">Brief<b>·</b>Calendar<b>·</b>Approvals<b>·</b>Reports<b>·</b>in one app</div>
</div>
<div class="chips">
 <div class="chip"><i>✓</i>Pay once · no subscription</div>
 <div class="chip"><i>✓</i>Works offline</div>
 <div class="chip"><i>✓</i>Desktop + phone</div>
</div>
</body></html>
